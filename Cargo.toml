[workspace]
members = ["agentcat-sdk"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/agentcathq/agentcat-rust-sdk"

[workspace.dependencies]
serde_json = { version = "1.0.45", default-features = false, features = ["std"] }
sha2 = { version = "0.10", default-features = false }
# "std" is needed to read PROPTEST_CASES and to save failing seeds in proptest-regressions/.
proptest = { version = "1", default-features = false, features = ["std"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# no panics in library code
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
# stdout is the MCP stdio protocol channel
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# every exception needs #[expect(lint, reason = "...")]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# pedantic lints we do not want
must_use_candidate = "allow"
