name: Release

# Two steps, with a pull request between them. CONTRIBUTING.md ("Release a version") has the steps
# and the one-time setup.
#
# 1. A manual run (Actions > Release > Run workflow) with `patch` (the default), `minor`, `major` or
#    an exact version X.Y.Z opens the pull request "Release vX.Y.Z". It sets the version in
#    agentcat-sdk/Cargo.toml and Cargo.lock and dates the [Unreleased] section of the CHANGELOG
#    (`xtask release prepare`). A pull request that GITHUB_TOKEN opens starts no workflow, so the run
#    starts ci.yml on the release branch itself.
# 2. The merge of that pull request into main publishes the version: when the version of Cargo.toml
#    has no tag and the CHANGELOG has its dated section (`xtask release status`), the run waits for
#    the ci.yml run of the merge commit, publishes the crate to crates.io with trusted publishing,
#    and then creates the tag vX.Y.Z and its GitHub release. A failed step publishes nothing after it;
#    the tag comes last, so a re-run of the failed jobs continues the release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: patch, minor, major, or an exact version X.Y.Z
        required: true
        default: patch
        type: string
  push:
    branches: [main]
    paths:
      - agentcat-sdk/Cargo.toml
      - agentcat-sdk/CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: The run is on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release workflow on main, not on $GITHUB_REF_NAME"
          exit 1
      # The full history holds the tags that the next version counts from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Set the version and date the CHANGELOG
        id: prepare
        env:
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(cargo run -q -p xtask -- release prepare "$INPUT" "$(date -u +%F)")"
          # crates.io never accepts a version twice, not even a yanked one.
          if curl -sSf https://index.crates.io/ag/en/agentcat-sdk | jq -e --arg v "$version" 'select(.vers == $v)' > /dev/null; then
            echo "::error::crates.io already has agentcat-sdk $version"
            exit 1
          fi
          cargo update -q --workspace
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add agentcat-sdk/Cargo.toml agentcat-sdk/CHANGELOG.md Cargo.lock
          git commit -m "Release v$VERSION"
          git push origin "$branch"
          cargo run -q -p xtask -- release notes "$VERSION" > notes.md
          {
            echo "Merging this pull request publishes \`agentcat-sdk\` $VERSION to crates.io, then tags \`v$VERSION\` and creates its GitHub release with these notes:"
            echo
            cat notes.md
          } > body.md
          gh pr create --base main --head "$branch" --title "Release v$VERSION" --body-file body.md
          gh workflow run ci.yml --ref "$branch"

  status:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.status.outputs.version }}
      publish: ${{ steps.status.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Is this version released?
        id: status
        run: |
          set -euo pipefail
          read -r version action <<<"$(cargo run -q -p xtask -- release status)"
          echo "agentcat-sdk $version: $action"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$action" = publish ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: status
    if: needs.status.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    # The environment is the one that the trusted publisher of agentcat-sdk on crates.io names.
    environment:
      name: release
      url: https://crates.io/crates/agentcat-sdk/${{ needs.status.outputs.version }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      VERSION: ${{ needs.status.outputs.version }}
    steps:
      # The CI run of this push to main checks the commit on every OS; the crate goes out only when it passes.
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 85); do
            read -r status conclusion <<<"$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs | sort_by(.run_attempt) | last | "\(.status // "none") \(.conclusion // "none")"')"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "CI passed on $GITHUB_SHA"
                exit 0
              fi
              echo "::error::CI on $GITHUB_SHA ended with $conclusion; re-run CI, then re-run this job"
              exit 1
            fi
            sleep 60
          done
          echo "::error::CI on $GITHUB_SHA did not finish in time"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # Trusted publishing: crates.io trades this job's OIDC token for a short-lived token, which the
      # action revokes when the job ends.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # A re-run after a publish that went through skips the publish.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          if curl -sSf https://index.crates.io/ag/en/agentcat-sdk | jq -e --arg v "$VERSION" 'select(.vers == $v)' > /dev/null; then
            echo "crates.io already has agentcat-sdk $VERSION"
            exit 0
          fi
          cargo publish -p agentcat-sdk --locked

  github-release:
    needs: [status, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.status.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Tag the commit and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo run -q -p xtask -- release notes "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
