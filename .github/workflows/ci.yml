name: CI

on:
  push:
    branches: [rewrite, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  hack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack
      - run: cargo hack clippy --workspace --each-feature --no-dev-deps -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/node-oracle
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      - run: cargo nextest run --workspace --all-features
      # R07 in a build of the SDK alone: in a workspace build, another member could turn on
      # serde_json/preserve_order for it (Cargo unifies features).
      - run: cargo test -p agentcat-sdk --all-features --test json_key_order
      - run: cargo test --workspace --doc

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # An older rustc can warn where the current one does not.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/node-oracle
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      - run: cargo nextest run --workspace --all-features
      - run: cargo test -p agentcat-sdk --all-features --test json_key_order

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: --cfg docsrs -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --all-features --no-deps
      # a second run checks the doc links of the crate-private items, which the first run skips
      - run: cargo doc --workspace --all-features --no-deps --document-private-items

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  minimal-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack,cargo-minimal-versions
      - run: cargo minimal-versions check --direct --workspace

  oracle-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/node-oracle
      # The harness tests run the Rust reference server.
      - run: cargo build -p harness-ref-server
      # One package at a time: oracle/test/fetch.test.mjs dirties the shared TS clone on purpose (R-17).
      - run: corepack pnpm -r --workspace-concurrency=1 test
      - run: node oracle/src/vectors/run.mjs --check
      - run: node oracle/src/parity/list-tests.mjs --check
      - run: node harness/src/dump-contract.mjs --check
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      - run: node --test "scripts/*.test.mjs"
      - run: cargo run -q -p xtask -- parity

  # L3: the MCP-wire delta of the Rust reference server against TS v2 (harness/README.md, "The L3 gate").
  harness-l3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/node-oracle
      - run: cargo build -p harness-ref-server
      # Every scenario, transport and lane: every delta difference ruled, every ruling used.
      - name: Matrix against TS v2
        run: node harness/src/matrix.mjs
      # The Rust server against itself: no difference at all, ruled or not.
      - name: A/A run
        run: |
          node harness/src/matrix.mjs --servers rust,rust --scenarios basic
          node -e '
            const doc = JSON.parse(require("node:fs").readFileSync("harness/out/matrix.json", "utf8"));
            const bad = doc.filter((c) => Object.values(c.exitCodes).some((code) => code !== 0) || !c.delta || c.delta.total !== 0);
            if (doc.length === 0 || bad.length > 0) {
              console.error(`L3 A/A failed: ${doc.length === 0 ? "no combination ran" : bad.map((c) => `${c.scenario} ${c.transport} ${c.lane}`).join(", ")}`);
              process.exit(1);
            }'
      # HARNESS_CANARY=1 perturbs the second server: the matrix must exit 1 with every driver passing and
      # an unruled difference in every combination.
      - name: Canary run
        run: |
          canary=0
          node harness/src/matrix.mjs --servers rust,rust --scenarios basic --env2 HARNESS_CANARY=1 || canary=$?
          if [ "$canary" -ne 1 ]; then
            echo "L3 canary failed: the matrix exited $canary, expected 1"
            exit 1
          fi
          node -e '
            const doc = JSON.parse(require("node:fs").readFileSync("harness/out/matrix.json", "utf8"));
            const bad = doc.filter((c) => Object.values(c.exitCodes).some((code) => code !== 0) || !c.delta || c.delta.unexpected === 0);
            if (doc.length === 0 || bad.length > 0) {
              console.error(`L3 canary failed: ${doc.length === 0 ? "no combination ran" : bad.map((c) => `${c.scenario} ${c.transport} ${c.lane}`).join(", ")}`);
              process.exit(1);
            }'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-l3-out
          path: harness/out
          retention-days: 14

  rmcp-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: list
        run: echo "versions=$(node scripts/rmcp-versions.mjs)" >> "$GITHUB_OUTPUT"

  rmcp:
    name: rmcp (${{ matrix.version }})
    needs: rmcp-versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.rmcp-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/node-oracle
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      - run: cargo update -p rmcp --precise ${{ matrix.version }}
      # rmcp-macros keeps its locked version otherwise (it still satisfies the older rmcp's requirement);
      # a version that does not exist makes this step fail.
      - run: cargo update -p rmcp-macros --precise ${{ matrix.version }}
      - run: grep -A1 -E '^name = "rmcp(-macros)?"$' Cargo.lock
      - run: cargo nextest run -p agentcat-sdk --all-features
      - run: cargo nextest run -p agentcat-sdk --test rmcp_version
        env:
          RMCP_EXPECTED_VERSION: ${{ matrix.version }}
      - run: cargo run -q -p xtask -- rmcp-canary

  all-green:
    if: always()
    needs: [fmt, clippy, hack, test, msrv, docs, deny, minimal-versions, oracle-harness, harness-l3, rmcp-versions, rmcp]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "a required job ended with: $r"
              exit 1
            fi
          done
