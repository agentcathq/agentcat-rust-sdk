name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  AGENTCAT_DISABLE_DIAGNOSTICS: "1"
  DISABLE_DIAGNOSTICS: "1"
  RUST_BACKTRACE: "1"

defaults:
  run:
    # Also on Windows; and with pipefail, unlike the implicit default shell.
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --lib --all-features -- -D warnings
      - run: cargo clippy --lib -- -D warnings
      - run: cargo clippy --lib --no-default-features --features rustls -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --all-targets
      - run: cargo test --doc

  rmcp:
    name: rmcp ${{ matrix.rmcp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rmcp: ['3.0.0', '3.3.0', 'newest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rmcp-${{ matrix.rmcp }}
      # Without `allow`, Cargo keeps the newest rmcp whose rust-version fits the MSRV.
      - if: matrix.rmcp == 'newest'
        run: cargo update -p rmcp -p rmcp-macros
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: allow
      - if: matrix.rmcp != 'newest'
        run: |
          cargo update -p rmcp --precise ${{ matrix.rmcp }}
          cargo update -p rmcp-macros --precise ${{ matrix.rmcp }}
      # Includes tests/trait_drift.rs, which fails when the resolved rmcp has a
      # ServerHandler method that Tracked<H> does not forward.
      - run: cargo test --all-targets
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: ${{ matrix.rmcp == 'newest' && 'allow' || 'fallback' }}

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: '1.88'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --lib --all-features

  minimal-versions:
    name: minimal-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-minimal-versions@0.1.37,cargo-hack@0.6.45
      - run: cargo minimal-versions check --direct --lib --all-features

  features:
    name: features
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack@0.6.45
      - run: cargo hack check --lib --feature-powerset --depth 2 --exclude-features default,exporters --at-least-one-of rustls,native-tls

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  public-api:
    name: public-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same nightly as scripts/check.sh: public-api.txt comes from it.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: nightly-2026-10-18
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-public-api@0.52.0
      - run: cargo +nightly-2026-10-18 public-api --simplified | diff -u public-api.txt -

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo llvm-cov --all-targets --lcov --output-path lcov.info --fail-under-lines "$(cat scripts/coverage-floor)"
      # Keep the report when the run fails the floor.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info

  mutants-diff:
    name: mutants (shard ${{ matrix.shard }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutate the changed lines
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" -- src > pr.diff
          mkdir -p out
          if [ -s pr.diff ]; then
            set +e
            cargo mutants --in-diff pr.diff --shard ${{ matrix.shard }}/4 --output out
            code=$?
            set -e
            # 0 all caught, 2 some missed, 3 some timed out: the score job decides.
            case $code in 0|2|3) ;; *) exit $code ;; esac
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-diff-${{ matrix.shard }}
          path: out/
          if-no-files-found: ignore

  mutants-diff-score:
    name: mutants score (changed code)
    if: github.event_name == 'pull_request'
    needs: mutants-diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-diff-*
          path: shards
      - run: python3 scripts/mutants-score.py --min-core 95 --min-adapter 95 shards/*/mutants.out

  all-green:
    name: all-green
    if: always()
    needs: [lint, test, rmcp, msrv, minimal-versions, features, deny, public-api, coverage, mutants-diff, mutants-diff-score]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
