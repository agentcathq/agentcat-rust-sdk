name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: catch new rmcp releases that add ServerHandler methods.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DISABLE_DIAGNOSTICS: "1"

jobs:
  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo test --doc

  newest-rmcp:
    name: Test against the newest rmcp 3.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo update -p rmcp -p rmcp-macros
      # Includes tests/trait_drift.rs: fails when rmcp adds a ServerHandler
      # method that Tracked<H> does not forward.
      - run: cargo test --all-targets

  oldest-rmcp:
    name: Library builds on rmcp 3.0.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo update -p rmcp --precise 3.0.0
      - run: cargo check --lib

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib

  features:
    name: Feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib --no-default-features --features rustls
      - run: cargo check --lib --no-default-features --features rmcp,rustls
      - run: cargo check --lib --no-default-features --features rmcp,native-tls,otlp
      - run: cargo check --lib --no-default-features --features rmcp,rustls,preserve-order,posthog

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
