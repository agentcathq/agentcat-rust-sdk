name: CI

on:
  push:
    branches: [rewrite, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the older run of that pull request. Every other run (a push
# to rewrite or main, a manual run) is in the group of its own commit, so a run for a later commit
# never cancels it or drops it from the queue: every pushed commit keeps a finished run (C48, C53).
# (GitHub drops a waiting run when a newer run joins its group, whatever cancel-in-progress says.)
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  hack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack
      - run: cargo hack clippy --workspace --each-feature --no-dev-deps -- -D warnings

  # Every push and pull request, on the three systems (C48).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/node-oracle
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      # The harness reference server has a branch for each system (its shutdown signal).
      - run: cargo build -p harness-ref-server
      # The oracle's build lock and its bundle builds, on each system's file semantics (Windows
      # refuses a rename onto a file that another process holds open).
      - run: node --test --test-concurrency=1 oracle/test/lock.test.mjs oracle/test/bundle.test.mjs
      - run: cargo nextest run --workspace --all-features
      # The tests that compile only without a TLS feature (C44's warning for an https: URL).
      - run: cargo nextest run -p agentcat-sdk --no-default-features
      # R07 in a build of the SDK alone: in a workspace build, another member could turn on
      # serde_json/preserve_order for it (Cargo unifies features).
      - run: cargo test -p agentcat-sdk --all-features --test json_key_order
      - run: cargo test --workspace --doc

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # An older rustc can warn where the current one does not.
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/node-oracle
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      - run: cargo nextest run --workspace --all-features
      - run: cargo test -p agentcat-sdk --all-features --test json_key_order
      # The README, the crate guide and the rustdoc examples that a person copies must compile on 1.88.
      - run: cargo test --workspace --doc --all-features

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: --cfg docsrs -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --workspace --all-features --no-deps
      # a second run checks the doc links of the crate-private items, which the first run skips
      - run: cargo doc --workspace --all-features --no-deps --document-private-items

  # The public API snapshot with its crate allowlist (C51), the package file list and the publish dry run.
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nightly gives cargo-public-api the rustdoc JSON (it runs `cargo +nightly`). Stable, installed last,
      # is the default: xtask and the package build run on stable, as in scripts/check.sh.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-public-api@0.52.0
      # To accept an intended change: cargo run -p xtask -- public-api --bless
      - run: cargo run -q -p xtask -- public-api
      - run: cargo run -q -p xtask -- package-list
      - run: cargo publish -p agentcat-sdk --dry-run --allow-dirty

  # Line coverage floors (C52): at least 90 % of the crate's lines and 95 % of the pure modules' lines,
  # test files left out. The nightly reports branch coverage.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The crate's unit tests spawn the JS oracle.
      - uses: ./.github/actions/node-oracle
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest,cargo-llvm-cov@0.9.1
      - run: >-
          cargo llvm-cov nextest -p agentcat-sdk --all-features
          --ignore-filename-regex '(/tests\.rs$|/test_support/|/tests/)'
          --json --summary-only --output-path target/coverage.json
      - run: cargo run -q -p xtask -- coverage target/coverage.json

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  minimal-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Stable for the serde_json floor test; nightly, installed last, is the default.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-hack,cargo-minimal-versions,nextest
      - run: cargo minimal-versions check --direct --workspace
      # The serde_json floor (R22): the feature self-check finds no feature in a build of the SDK
      # alone on serde_json 1.0.127, the workspace's floor. serde_with 3.15 and later need a newer
      # serde_json, so serde_with goes down to 3.14.1 first. The pins go on Cargo.lock, which is
      # restored after.
      - name: serde_json floor
        run: |
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock"
          cargo update -p serde_with --precise 3.14.1
          cargo update -p serde_json --precise 1.0.127
          cargo +stable nextest run -p agentcat-sdk --all-features --lib --no-tests=fail -E 'test(=delivery::tests::json_features_empty_in_this_build)'
          cp "$RUNNER_TEMP/Cargo.lock" Cargo.lock

  oracle-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/node-oracle
      # The harness tests run the Rust reference server.
      - run: cargo build -p harness-ref-server
      # One package at a time: oracle/test/fetch.test.mjs dirties the shared TS clone on purpose (R-17).
      - run: corepack pnpm -r --workspace-concurrency=1 test
      - run: node oracle/src/vectors/run.mjs --check
      - run: node oracle/src/parity/list-tests.mjs --check
      - run: node harness/src/dump-contract.mjs --check
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      - run: node --test "scripts/*.test.mjs"
      - run: cargo run -q -p xtask -- parity --final
      # The customer examples (C54) against the local mock API: stdout carries only JSON-RPC, the last
      # event arrives, and the process exits 0 within 5 s of the client close.
      - run: cargo build -p agentcat-sdk --examples --all-features
      - name: Examples check
        run: |
          for example in stdio streamable_http hooks; do
            node harness/src/examples-check.mjs "$example"
          done

  # L3: the MCP-wire delta of the Rust reference server against TS v2 (harness/README.md, "The L3 gate").
  harness-l3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/node-oracle
      - run: cargo build -p harness-ref-server
      # Every scenario, transport and lane: every delta and event difference ruled, every ruling used,
      # every tracked Rust server drained.
      - name: Matrix against TS v2
        run: node harness/src/matrix.mjs
      # The Rust server against itself: no delta or event difference at all, ruled or not.
      - name: A/A run
        run: |
          node harness/src/matrix.mjs --servers rust,rust --scenarios basic
          node harness/src/l3-expect.mjs none
      # HARNESS_CANARY=1 perturbs the second server: the matrix must exit 1 with every driver passing and
      # an unruled delta difference in every combination, at the canary's paths only, and no event difference.
      - name: Canary run
        run: |
          canary=0
          node harness/src/matrix.mjs --servers rust,rust --scenarios basic --env2 HARNESS_CANARY=1 || canary=$?
          if [ "$canary" -ne 1 ]; then
            echo "L3 canary failed: the matrix exited $canary, expected 1"
            exit 1
          fi
          node harness/src/l3-expect.mjs caught
      # HARNESS_CANARY=call changes the mint-back text after the SDK recorded the call: caught in the delta
      # (results' first content block) of every combination, and nowhere in the events.
      # HARNESS_CANARY=event renames every event in a redact_event hook: caught in the events (resource_name)
      # of every combination, and nowhere in the delta.
      - name: Call and event canary runs
        run: |
          for canary in call event; do
            status=0
            node harness/src/matrix.mjs --servers rust,rust --scenarios basic --env2 "HARNESS_CANARY=$canary" || status=$?
            if [ "$status" -ne 1 ]; then
              echo "L3 $canary canary failed: the matrix exited $status, expected 1"
              exit 1
            fi
            node harness/src/l3-expect.mjs "caught-$canary"
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-l3-out
          path: harness/out
          retention-days: 14

  rmcp-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.list.outputs.legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # [{"version": <rmcp>, "macros": <rmcp-macros>}, ...]: one leg per rmcp minor.
      - id: list
        run: |
          legs="$(node scripts/rmcp-versions.mjs)"
          echo "legs=$legs" >> "$GITHUB_OUTPUT"

  rmcp:
    name: rmcp (${{ matrix.version }})
    needs: rmcp-versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.rmcp-versions.outputs.legs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/node-oracle
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      - run: cargo update -p rmcp --precise ${{ matrix.version }}
      # rmcp-macros keeps its locked version otherwise (it still satisfies the older rmcp's requirement).
      # The leg takes the highest rmcp-macros of the same minor (scripts/rmcp-versions.mjs): an rmcp
      # patch can come without an rmcp-macros patch of the same number.
      - run: cargo update -p rmcp-macros --precise ${{ matrix.macros }}
      - run: grep -A1 -E '^name = "rmcp(-macros)?"$' Cargo.lock
      - run: cargo nextest run -p agentcat-sdk --all-features
      # The examples and the doc examples that a person copies must compile on every rmcp minor.
      - run: cargo build -p agentcat-sdk --examples --all-features
      - run: cargo test -p agentcat-sdk --doc --all-features
      - run: cargo nextest run -p agentcat-sdk --test rmcp_version
        env:
          RMCP_EXPECTED_VERSION: ${{ matrix.version }}
      - run: cargo run -q -p xtask -- rmcp-canary

  all-green:
    if: always()
    needs: [fmt, clippy, hack, test, msrv, docs, api, coverage, deny, minimal-versions, oracle-harness, harness-l3, rmcp-versions, rmcp]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "a required job ended with: $r"
              exit 1
            fi
          done
