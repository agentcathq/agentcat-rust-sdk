name: Nightly

# GitHub schedules and dispatches only workflows on the default branch (main), so the schedule starts
# once this file reaches main. The push trigger runs it on main when this file, the mutation settings
# or the mutation script change. Every job runs on every nightly run, push runs included: the Rust suite with long
# property runs, the branch coverage report (its percentage is a report and never a failure), the
# full mutation set (`mutants-full`, `mutants-score`), and the rmcp and agentcat-api legs.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nightly.yml"
      - ".cargo/**"
      - "scripts/mutants-run.sh"

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The Rust suite on the three systems, with long property runs.
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: nextest
      # Every test runs, so a failure on one system does not hide the next ones.
      - run: cargo nextest run --workspace --all-features --no-fail-fast
        env:
          PROPTEST_CASES: "10000"

  # Branch coverage of the SDK crate, test files left out, on the nightly toolchain that `--branch`
  # needs. Report only: the run summary shows the percentage against its target of 85 %, and the
  # percentage never fails the run. The line floors run on every push (ci.yml, job `coverage`).
  coverage-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: nextest,cargo-llvm-cov@0.9.1
      - run: >-
          cargo +nightly llvm-cov nextest -p agentcat-sdk --all-features --branch
          --ignore-filename-regex '(/tests\.rs$|/test_support/|/tests/)'
          --json --summary-only --output-path target/coverage-branch.json
      # `shell: bash` adds `-o pipefail`: a missing or unreadable report fails the step, not only `tee`.
      # No step compares the percentage.
      - name: Branch coverage in the run summary
        shell: bash
        run: |
          jq -r '.data[0].totals.branches
            | "Branch coverage of agentcat-sdk: \(.covered) of \(.count) branches, \((.percent * 10 | floor) / 10) % (target 85 %, report only)."' \
            target/coverage-branch.json | tee -a "$GITHUB_STEP_SUMMARY"

  # The full mutation set in 8 shards. A shard fails only when cargo-mutants itself fails (exit code
  # 1 usage, 4 the unmutated tree fails its tests); surviving or timed-out mutants (2, 3) are judged by
  # `mutants-score` from all shards together.
  mutants-full:
    name: mutants-full (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: nextest,cargo-mutants@27.1.0
      - name: Mutants of shard ${{ matrix.shard }} of 8
        shell: bash
        run: |
          MUTANTS_OK_CODES="0 2 3" scripts/mutants-run.sh --shard "${{ matrix.shard }}/8"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14

  # Merges the shards' outcomes.json and fails below 90 % detected of the viable mutants. Detected: caught
  # or timed out (a timeout counts as detected). Viable: not unviable (the mutant builds). It
  # also fails when a shard did not succeed: a shard that failed or timed out can leave a partial
  # outcomes.json, and a score of partial data could pass.
  mutants-score:
    needs: mutants-full
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutants-shard-*
          path: shards
      - name: Score
        shell: bash
        env:
          FULL_RESULT: ${{ needs.mutants-full.result }}
        run: |
          set -euo pipefail
          if [ "$FULL_RESULT" != success ]; then
            echo "mutants-full ended with: $FULL_RESULT; every shard must succeed for a score"
            exit 1
          fi
          for k in 0 1 2 3 4 5 6 7; do
            if [ ! -f "shards/mutants-shard-$k/outcomes.json" ]; then
              echo "no outcomes.json for shard $k (mutants-full ended with: $FULL_RESULT)"
              exit 1
            fi
          done
          jq -s '{caught: (map(.caught) | add), missed: (map(.missed) | add), timeout: (map(.timeout) | add), unviable: (map(.unviable) | add)}' \
            shards/mutants-shard-*/outcomes.json > score.json
          jq -r '. as $s | ($s.caught + $s.missed + $s.timeout) as $viable
            | (if $viable == 0 then 100 else (($s.caught + $s.timeout) * 1000 / $viable | floor) / 10 end) as $pct
            | "Mutation score: \($s.caught) caught, \($s.missed) missed, \($s.timeout) timeout, \($s.unviable) unviable; \($pct) % detected (caught or timeout) of \($viable) viable (floor 90 %)."' \
            score.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '(.caught + .missed + .timeout) as $v | $v == 0 or ((.caught + .timeout) * 100 / $v >= 90)' score.json > /dev/null

  # The SDK tests and the rmcp canary against rmcp's git `main`, through a [patch.crates-io] added at run
  # time (the repository is not changed). A failure means rmcp main changed; it feeds no other job.
  rmcp-main:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: nextest
      - name: Patch rmcp to git main
        run: |
          printf '\n[patch.crates-io]\nrmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", branch = "main" }\n' >> Cargo.toml
          cargo update -p rmcp
          grep -A2 -E '^name = "rmcp(-macros)?"$' Cargo.lock
          # Cargo only warns when a patch does not match the requirement (rmcp main at 4.x or a prerelease);
          # the leg would then test the rmcp of the lock. Stop unless rmcp comes from the git source.
          if ! grep -q 'source = "git+https://github.com/modelcontextprotocol/rust-sdk' Cargo.lock; then
            echo "rmcp-main: Cargo.lock has no rmcp from git main; the [patch.crates-io] entry is unused (rmcp main no longer matches the ^3 requirement?)"
            exit 1
          fi
      - run: cargo nextest run -p agentcat-sdk --all-features
      - run: cargo build -p agentcat-sdk --examples --all-features
      - run: cargo run -q -p xtask -- rmcp-canary

  rmcp-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      legs: ${{ steps.list.outputs.legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # [{"version": <rmcp>, "macros": <rmcp-macros>}, ...]: one leg per rmcp minor, from the crates.io API.
      - id: list
        run: |
          legs="$(cargo run -q -p xtask -- rmcp-versions)"
          echo "legs=$legs" >> "$GITHUB_OUTPUT"

  # The canary (every ServerHandler method forwarded) on the highest patch of every rmcp 3.x minor.
  rmcp-canary:
    name: rmcp-canary (${{ matrix.version }})
    needs: rmcp-versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.rmcp-versions.outputs.legs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo update -p rmcp --precise ${{ matrix.version }}
      - run: cargo update -p rmcp-macros --precise ${{ matrix.macros }}
      - run: grep -A1 -E '^name = "rmcp(-macros)?"$' Cargo.lock
      - run: cargo run -q -p xtask -- rmcp-canary

  # The SDK against the newest agentcat-api on crates.io (the workspace pins "=0.0.3"). The job
  # never fails the run: a break shows as a warning and a note in the run summary.
  agentcat-api-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: nextest
      - name: Use the newest agentcat-api
        run: |
          sed -i 's/^agentcat-api = { version = "=[^"]*"/agentcat-api = { version = "*"/' Cargo.toml
          grep -n '^agentcat-api' Cargo.toml
          cargo update -p agentcat-api
          grep -A1 -E '^name = "agentcat-api"$' Cargo.lock
      - run: cargo nextest run -p agentcat-sdk --all-features
      - if: failure()
        run: |
          echo "::warning title=agentcat-api::The SDK does not build or pass its tests against the newest agentcat-api."
          echo "The SDK does not build or pass its tests against the newest agentcat-api on crates.io (the workspace pins it with \`=\`). Read the log of this job." >> "$GITHUB_STEP_SUMMARY"
