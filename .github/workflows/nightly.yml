name: Nightly

# GitHub schedules and dispatches only workflows on the default branch (main), so the schedule starts
# once this file reaches main. The push trigger runs it on rewrite when the oracle, the harness or the
# workflow files change (R-14). A scheduled or dispatched run fails on drift and opens or updates the
# `ts-drift` issue. A push run never opens an issue: it reports drift as a warning and fails only when
# a job crashes (the drift job itself, the Rust suite, or the branch coverage run, whose percentage is
# a report and never a failure). The mutation shards (`mutants-full`, `mutants-score`) and the rmcp and
# agentcat-api legs run on every nightly run, push runs included; none of them feeds the `report` job.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [rewrite]
    paths:
      - ".github/workflows/nightly.yml"
      - ".github/actions/**"
      - ".cargo/**"
      - "scripts/ts-drift-issue.sh"
      - "oracle/**"
      - "harness/**"

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs basic.json on each TS server at the pinned commit first, before any TS main code runs in
  # this job. Then builds TS `main`, regenerates the vectors and the test list and compares them with
  # the committed files, runs basic.json twice (A/A) on each TS server at main, and diffs the pinned
  # runs against the first main runs. A failure at TS main is drift; a failure at the pinned commit
  # fails the job.
  #
  # The TS reference servers get the local mock as their API URL (AGENTCAT_API_URL and the apiBaseUrl
  # option). They, the vector generators and `vitest list` run under the egress guard
  # (oracle/src/egress-guard.mjs), which refuses non-loopback fetch, TCP and TLS connections, DNS
  # lookups and UDP sends in those Node processes and in the Node processes vitest starts. It does
  # not cover worker threads or other runtimes (workerd), and the clone, `pnpm install` and build of
  # TS main run unguarded because they need the network. This job saves no cache.
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve TS main
        id: main
        run: |
          repo="$(jq -r .repo oracle/oracle.lock)"
          sha="$(git ls-remote "$repo" refs/heads/main | cut -f1)"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "could not resolve main of $repo (got: $sha)"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pinned=$(jq -r .sha oracle/oracle.lock)" >> "$GITHUB_OUTPUT"
      # Read-only: TS main code runs later in this job with write access to oracle/.cache.
      - uses: ./.github/actions/node-oracle
        with:
          cache: restore
      - name: Runs of basic.json on both TS servers at the pinned commit
        run: |
          node oracle/src/fetch-ts.mjs
          for server in ts-v1 ts-v2; do
            node harness/src/driver.mjs harness/scenarios/basic.json "$server-pinned" stdio \
              -- node --import ./harness/src/egress-guard.mjs "harness/src/servers/$server.mjs"
          done
      - name: Regenerate the vectors and the test list at TS main
        id: generate
        continue-on-error: true
        env:
          ORACLE_SHA: ${{ steps.main.outputs.sha }}
        run: |
          # Output from TS main is printed with workflow commands turned off.
          code=0
          (
            node oracle/src/fetch-ts.mjs || exit 1
            node --import ./oracle/src/egress-guard.mjs oracle/src/vectors/run.mjs --out "$RUNNER_TEMP/vectors" || exit 1
            node oracle/src/parity/list-tests.mjs --out "$RUNNER_TEMP/parity" || exit 1
          ) > "$RUNNER_TEMP/generate.txt" 2>&1 || code=$?
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          cat "$RUNNER_TEMP/generate.txt"
          echo "::$stop::"
          exit "$code"
      - name: Compare with the committed files
        id: compare
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        run: |
          code=0
          node oracle/src/drift/compare.mjs "$RUNNER_TEMP/vectors" "$RUNNER_TEMP/parity" > "$RUNNER_TEMP/compare.md" 2>&1 || code=$?
          # The findings quote upstream test titles: print them with workflow commands turned off.
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          cat "$RUNNER_TEMP/compare.md"
          echo "::$stop::"
          exit "$code"
      - name: A/A runs of basic.json on both TS servers at TS main
        id: aa
        continue-on-error: true
        env:
          ORACLE_SHA: ${{ steps.main.outputs.sha }}
        run: |
          code=0
          (
            for server in ts-v1 ts-v2; do
              for n in 1 2; do
                node harness/src/driver.mjs harness/scenarios/basic.json "$server-aa$n" stdio \
                  -- node --import ./harness/src/egress-guard.mjs "harness/src/servers/$server.mjs" || exit 1
              done
              node harness/src/diff.mjs \
                "harness/out/basic.$server-aa1.stdio.normalized.json" \
                "harness/out/basic.$server-aa2.stdio.normalized.json" \
                --rulings harness/rulings-ts.json || exit 1
            done
          ) > "$RUNNER_TEMP/aa.txt" 2>&1 || code=$?
          # Output from TS main is printed with workflow commands turned off.
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          cat "$RUNNER_TEMP/aa.txt"
          echo "::$stop::"
          exit "$code"
      - name: Diff the pinned runs against TS main
        id: harness
        continue-on-error: true
        run: |
          report="$RUNNER_TEMP/harness.md"
          : > "$report"
          for server in ts-v1 ts-v2; do
            main="harness/out/basic.$server-aa1.stdio.normalized.json"
            if [ ! -f "$main" ]; then
              echo "- basic.json on $server: no run at TS main to compare with." >> "$report"
              continue
            fi
            code=0
            node harness/src/diff.mjs "harness/out/basic.$server-pinned.stdio.normalized.json" "$main" \
              --rulings harness/rulings-ts.json > "$RUNNER_TEMP/diff-$server.txt" 2>&1 || code=$?
            # Values from TS main: print them with workflow commands turned off.
            stop="$(openssl rand -hex 16)"
            echo "::stop-commands::$stop"
            cat "$RUNNER_TEMP/diff-$server.txt"
            echo "::$stop::"
            if [ "$code" -ne 0 ]; then
              {
                echo "basic.json on $server, pinned against TS main (diff.mjs exit $code; at most 50 lines):"
                echo
                echo '```'
                grep -E '^(DIFF|UNUSED RULING) ' "$RUNNER_TEMP/diff-$server.txt" | head -n 50 || true
                echo '```'
                echo
              } >> "$report"
            fi
          done
          if [ -s "$report" ]; then exit 1; fi
      - name: Summarize
        id: summary
        env:
          MAIN_SHA: ${{ steps.main.outputs.sha }}
          PINNED_SHA: ${{ steps.main.outputs.pinned }}
          GENERATE: ${{ steps.generate.outcome }}
          COMPARE: ${{ steps.compare.outcome }}
          AA: ${{ steps.aa.outcome }}
          HARNESS: ${{ steps.harness.outcome }}
        run: |
          out="$RUNNER_TEMP/summary.md"
          : > "$out"
          if [ "$GENERATE" != success ]; then
            echo "- Generating the vectors or the test list at TS main failed." >> "$out"
          fi
          if [ "$COMPARE" = failure ]; then
            { echo "Differences from the committed files:"; echo; cat "$RUNNER_TEMP/compare.md"; } >> "$out"
          fi
          if [ "$AA" != success ]; then
            {
              echo "- The A/A run of basic.json on a TS server failed at TS main. The last 50 lines of its output:"
              echo
              echo '```'
              tail -n 50 "$RUNNER_TEMP/aa.txt" 2>/dev/null || true
              echo '```'
            } >> "$out"
          fi
          if [ "$HARNESS" != success ]; then
            { echo; echo "Harness runs at the pinned commit against TS main:"; echo; cat "$RUNNER_TEMP/harness.md"; } >> "$out"
          fi
          if [ -s "$out" ]; then
            { printf 'TS main `%s` against the pinned `%s`.\n\n' "$MAIN_SHA" "$PINNED_SHA"; cat "$out"; } > "$out.text"
            # Cut the text first (iconv -c drops a UTF-8 character the cut split), then append the link.
            head -c 49000 "$out.text" | { iconv -c -f UTF-8 -t UTF-8 || true; } > "$out.full"
            printf '\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$out.full"
            # Test titles come from upstream: a random delimiter stops them from injecting outputs.
            delim="EOF_$(openssl rand -hex 16)"
            { echo "summary<<$delim"; cat "$out.full"; echo; echo "$delim"; } >> "$GITHUB_OUTPUT"
          fi

  # The Rust suite at the pinned SHA, with long property runs. The macOS and Windows legs
  # need Node because the crate's unit tests spawn the JS oracle.
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/node-oracle
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      # Every test runs, so a failure on one system does not hide the next ones.
      - run: cargo nextest run --workspace --all-features --no-fail-fast
        env:
          PROPTEST_CASES: "10000"

  # Branch coverage of the SDK crate (C52), test files left out, on the nightly toolchain that `--branch`
  # needs. Report only: the run summary shows the percentage against its target of 85 %, and the
  # percentage never fails the run. The line floors run on every push (ci.yml, job `coverage`).
  coverage-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The crate's unit tests spawn the JS oracle.
      - uses: ./.github/actions/node-oracle
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest,cargo-llvm-cov@0.9.1
      - run: >-
          cargo +nightly llvm-cov nextest -p agentcat-sdk --all-features --branch
          --ignore-filename-regex '(/tests\.rs$|/test_support/|/tests/)'
          --json --summary-only --output-path target/coverage-branch.json
      # `shell: bash` adds `-o pipefail`: a missing or unreadable report fails the step, not only `tee`.
      # No step compares the percentage.
      - name: Branch coverage in the run summary
        shell: bash
        run: |
          jq -r '.data[0].totals.branches
            | "Branch coverage of agentcat-sdk: \(.covered) of \(.count) branches, \((.percent * 10 | floor) / 10) % (target 85 %, report only)."' \
            target/coverage-branch.json | tee -a "$GITHUB_STEP_SUMMARY"

  # The full mutation set (C53) in 8 shards. A shard fails only when cargo-mutants itself fails (exit code
  # 1 usage, 4 the unmutated tree fails its tests); surviving or timed-out mutants (2, 3) are judged by
  # `mutants-score` from all shards together. The mutant copy carries oracle/.cache and node_modules
  # (.cargo/mutants.toml).
  mutants-full:
    name: mutants-full (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/node-oracle
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest,cargo-mutants@27.1.0
      - name: Mutants of shard ${{ matrix.shard }} of 8
        shell: bash
        run: |
          code=0
          cargo mutants --shard "${{ matrix.shard }}/8" || code=$?
          case "$code" in
            0 | 2 | 3) ;;
            *) echo "cargo mutants exited $code"; exit "$code" ;;
          esac
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14

  # Merges the shards' outcomes.json and fails below 90 % caught of the viable mutants. Viable: not
  # unviable (the mutant builds). A timeout counts as viable and not as caught.
  mutants-score:
    needs: mutants-full
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutants-shard-*
          path: shards
      - name: Score
        shell: bash
        env:
          FULL_RESULT: ${{ needs.mutants-full.result }}
        run: |
          set -euo pipefail
          for k in 0 1 2 3 4 5 6 7; do
            if [ ! -f "shards/mutants-shard-$k/outcomes.json" ]; then
              echo "no outcomes.json for shard $k (mutants-full ended with: $FULL_RESULT)"
              exit 1
            fi
          done
          jq -s '{caught: (map(.caught) | add), missed: (map(.missed) | add), timeout: (map(.timeout) | add), unviable: (map(.unviable) | add)}' \
            shards/mutants-shard-*/outcomes.json > score.json
          jq -r '. as $s | ($s.caught + $s.missed + $s.timeout) as $viable
            | (if $viable == 0 then 100 else ($s.caught * 1000 / $viable | floor) / 10 end) as $pct
            | "Mutation score: \($s.caught) caught, \($s.missed) missed, \($s.timeout) timeout, \($s.unviable) unviable; \($pct) % caught of \($viable) viable (floor 90 %)."' \
            score.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '(.caught + .missed + .timeout) as $v | $v == 0 or (.caught * 100 / $v >= 90)' score.json > /dev/null

  # The SDK tests and the rmcp canary against rmcp's git `main`, through a [patch.crates-io] added at run
  # time (the repository is not changed). A failure means rmcp main changed; it feeds no other job.
  rmcp-main:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/node-oracle
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      - name: Patch rmcp to git main
        run: |
          printf '\n[patch.crates-io]\nrmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", branch = "main" }\n' >> Cargo.toml
          cargo update -p rmcp
          grep -A2 -E '^name = "rmcp(-macros)?"$' Cargo.lock
      - run: cargo nextest run -p agentcat-sdk --all-features
      - run: cargo build -p agentcat-sdk --examples --all-features
      - run: cargo run -q -p xtask -- rmcp-canary

  rmcp-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.list.outputs.legs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: list
        run: |
          legs="$(node scripts/rmcp-versions.mjs)"
          echo "legs=$legs" >> "$GITHUB_OUTPUT"

  # The canary (every ServerHandler method forwarded) on the highest patch of every rmcp 3.x minor.
  rmcp-canary:
    name: rmcp-canary (${{ matrix.version }})
    needs: rmcp-versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.rmcp-versions.outputs.legs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo update -p rmcp --precise ${{ matrix.version }}
      - run: cargo update -p rmcp-macros --precise ${{ matrix.macros }}
      - run: grep -A1 -E '^name = "rmcp(-macros)?"$' Cargo.lock
      - run: cargo run -q -p xtask -- rmcp-canary

  # The SDK against the newest agentcat-api on crates.io (the workspace pins "=0.0.3", R11). The job
  # never fails the run: a break shows as a warning and a note in the run summary.
  agentcat-api-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/node-oracle
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      - name: Use the newest agentcat-api
        run: |
          sed -i 's/^agentcat-api = { version = "=[^"]*"/agentcat-api = { version = "*"/' Cargo.toml
          grep -n '^agentcat-api' Cargo.toml
          cargo update -p agentcat-api
          grep -A1 -E '^name = "agentcat-api"$' Cargo.lock
      - run: cargo nextest run -p agentcat-sdk --all-features
      - if: failure()
        run: |
          echo "::warning title=agentcat-api::The SDK does not build or pass its tests against the newest agentcat-api."
          echo "The SDK does not build or pass its tests against the newest agentcat-api on crates.io (the workspace pins it with \`=\`). Read the log of this job." >> "$GITHUB_STEP_SUMMARY"

  # Opens or updates the one open `ts-drift` issue (scheduled and dispatched runs). A push run only
  # prints the findings: drift is a warning there, a crashed job a failure.
  report:
    if: always()
    needs: [drift, rust]
    runs-on: ubuntu-latest
    # Only this job can write issues; it runs no code from TS main.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_RESULT: ${{ needs.drift.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          DRIFT_SUMMARY: ${{ needs.drift.outputs.summary }}
          EVENT: ${{ github.event_name }}
        run: |
          out="$RUNNER_TEMP/issue.md"
          : > "$out"
          crashed=0
          if [ -n "$DRIFT_SUMMARY" ]; then
            printf '%s\n' "$DRIFT_SUMMARY" >> "$out"
          fi
          if [ "$DRIFT_RESULT" != success ]; then
            printf '\n- The drift job ended with: %s\n' "$DRIFT_RESULT" >> "$out"
            crashed=1
          fi
          if [ "$RUST_RESULT" != success ]; then
            printf '\n- The Rust suite (PROPTEST_CASES=10000, macOS, Windows and Linux) ended with: %s\n' "$RUST_RESULT" >> "$out"
            crashed=1
          fi
          if [ ! -s "$out" ]; then
            echo "no drift and no failure: no issue opened"
            exit 0
          fi
          if [ "$crashed" = 1 ] && [ -z "$DRIFT_SUMMARY" ]; then
            printf 'Run: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$out"
          fi
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
          # The findings quote upstream test titles: print them with workflow commands turned off.
          stop="$(openssl rand -hex 16)"
          echo "::stop-commands::$stop"
          cat "$out"
          echo "::$stop::"
          if [ "$EVENT" = push ]; then
            if [ -n "$DRIFT_SUMMARY" ]; then
              echo "::warning title=TS drift::TS main differs from the pinned commit; the run summary lists the findings. A push run opens no issue."
            fi
            echo "push run: no issue opened"
            exit "$crashed"
          fi
          scripts/ts-drift-issue.sh "$out"
          exit 1
