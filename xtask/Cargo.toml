[package]
name = "xtask"
version = "0.0.0"
description = "Repository tasks for the AgentCat Rust SDK workspace: checks and CI helpers"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The mock AgentCat API of the examples check.
axum = { workspace = true, features = ["http1", "tokio"] }
# rmcp-versions reads the crates.io API over HTTPS; the examples check talks plain HTTP on loopback.
reqwest = { workspace = true, features = ["rustls"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "process", "io-util", "sync"] }
toml = { workspace = true, features = ["std", "serde", "parse"] }

[lints]
workspace = true
