# A checkout for xtask's repository-level parity test (parity::tests): every link between the
# manifest and the vector files, right and wrong. Each entry says what it shows.

# Claimed: the case a:claimed pins this key, and the reason names that case.
[[test]]
key = "v1|src/tests/links.test.ts|links > claimed by its vector case"
status = "n/a"
category = "covered-by-vector:alpha.json"
reason = "alpha.json case a:claimed; checked by xtask"

# The case a:repeated lists this key twice: a repeated key.
[[test]]
key = "v1|src/tests/links.test.ts|links > listed twice in one case"
status = "n/a"
category = "covered-by-vector:alpha.json"
reason = "alpha.json case a:repeated"

# The case a:todo pins this key, but the entry is todo: an unclaimed case.
[[test]]
key = "v1|src/tests/links.test.ts|links > todo entry"
status = "todo"

# The case a:ported pins this key, but the entry is ported: an unclaimed case.
[[test]]
key = "v1|src/tests/links.test.ts|links > ported entry"
status = "ported"
rust = ["harness:basic"]

# The case a:other pins this key, but the entry has another category: an unclaimed case.
[[test]]
key = "v1|src/tests/links.test.ts|links > another category"
status = "n/a"
category = "ruled-divergence:RD-01"
reason = "a deviation"

# No case pins this key (a missing vector case), and the reason names a case alpha.json lacks.
[[test]]
key = "v1|src/tests/links.test.ts|links > no case lists it"
status = "n/a"
category = "covered-by-vector:alpha.json"
reason = "alpha.json cases a:claimed and a:nope"

# beta.json does not exist: a bad category, and the case the reason names is unknown.
[[test]]
key = "v1|src/tests/links.test.ts|links > its vector file is missing"
status = "n/a"
category = "covered-by-vector:beta.json"
reason = "beta.json case b:one"

# The last key has no entry: unmapped, and the case a:missing that pins it is unclaimed.
