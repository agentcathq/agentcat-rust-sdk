[advisories]
ignore = [
  # chrono has no maintainer: a notice, not a vulnerability, and no version fixes it. rmcp,
  # schemars and agentcat-api depend on chrono, so this SDK cannot drop it alone. Remove this
  # entry when those crates move to another date library.
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; rmcp, schemars and agentcat-api depend on it" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
